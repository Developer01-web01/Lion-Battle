<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LION BATTLE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123767,#050914 65%);color:white;font:15px Arial}header,main{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#3bbdff}button{background:linear-gradient(90deg,#005cf1,#00baff);color:white;border:0;border-radius:10px;padding:13px;cursor:pointer;font-weight:bold}input,select{width:100%;padding:13px;margin:8px 0 14px;background:#07152b;color:white;border:1px solid #37679b;border-radius:8px}.box,.card{padding:22px;background:#0b192e;border:1px solid #25548b;border-radius:17px;margin:15px 0}.box{max-width:450px;margin:30px auto}.logo{text-align:center;font-size:90px;color:#36c5ff;text-shadow:0 0 30px #008cff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{margin:0}.muted{color:#9eb8d6}.hide{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{flex:1}#msg{color:#64d8ff;min-height:22px;text-align:center}</style></head><body><header><strong>♌ LION <span style="color:#35c5ff">BATTLE</span></strong><button id="logout" class="hide">Logout</button></header><main><section id="auth" class="box"><div class="logo">♌</div><h1 style="text-align:center">LION BATTLE</h1><p class="muted" style="text-align:center">ENTER THE ARENA</p><div class="nav"><button id="loginMode">LOGIN</button><button id="signupMode">SIGN UP</button></div><form id="authForm"><div id="extra" class="hide"><input id="name" placeholder="First and last name"><input id="phone" placeholder="Phone number (profile only)" type="tel"><input id="uid" placeholder="Free Fire UID"><input id="referral" placeholder="Referral code (optional)"></div><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (min 6 characters)" minlength="6" required><button style="width:100%" id="authButton">LOGIN</button></form><button id="reset" style="background:none">Forgot password?</button></section><section id="home" class="hide"><div class="box" style="max-width:none"><h1>♌ WELCOME TO LION BATTLE</h1><p class="muted">Free-entry esports community tournaments</p></div><div class="nav"><button data-tab="matches">Matches</button><button data-tab="mine">My Matches</button><button data-tab="profile">Profile</button><button id="adminTab" data-tab="admin" class="hide">Admin</button></div><section id="matches"><h2>Upcoming Matches</h2><div id="cards" class="grid"></div></section><section id="mine" class="hide"><h2>My Matches</h2><div id="myCards" class="grid"></div></section><section id="profile" class="hide box"><h2>Profile</h2><div id="details"></div><form id="uidForm"><input id="newUid" placeholder="Free Fire UID" required><button>Update UID</button></form></section><section id="admin" class="hide"><div class="box"><h2>Create tournament</h2><form id="create"><input id="title" placeholder="Tournament title" required><select id="mode"><option>Battle Royale Solo</option><option>Battle Royale Duo</option><option>Battle Royale Squad</option><option>Clash Squad</option><option>Lone Wolf</option></select><input id="map" placeholder="Map" required><input id="date" type="datetime-local" required><input id="slots" type="number" min="1" max="100" value="48" required><button>Create free tournament</button></form></div><h2>Manage</h2><div id="manage" class="grid"></div></section></section><p id="msg" role="status"></p></main><script type="module" src="app.js"></script></body></html>
